name: Production release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/maliyet-platformu-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/maliyet-platformu-web

jobs:
  release:
    name: Build, attest and publish production images
    runs-on: ubuntu-latest
    steps:
      - name: Require canonical main ref
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest API image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest web image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Write immutable release manifest
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "schema_version": 1,
              "git_sha": os.environ["GITHUB_SHA"],
              "api": {
                  "image": os.environ["API_IMAGE"],
                  "digest": os.environ["API_DIGEST"],
              },
              "web": {
                  "image": os.environ["WEB_IMAGE"],
                  "digest": os.environ["WEB_DIGEST"],
              },
          }
          Path("release-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
