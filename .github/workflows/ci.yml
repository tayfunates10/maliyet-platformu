name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    env:
      API_IMAGE_REPOSITORY: ghcr.io/example/maliyet-api
      API_IMAGE_DIGEST: 1111111111111111111111111111111111111111111111111111111111111111
      WEB_IMAGE_REPOSITORY: ghcr.io/example/maliyet-web
      WEB_IMAGE_DIGEST: 2222222222222222222222222222222222222222222222222222222222222222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/check_repository_contract.py
      - run: python scripts/check_production_rollout_contract.py
      - run: python -m compileall -q scripts services/api/app services/api/tests

  api-quality:
    name: API quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: maliyet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maliyet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/maliyet_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/maliyet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API and development tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest
      - name: Production migration ceremony
        run: python scripts/production_migrate.py

  api-container:
    name: API production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build --file services/api/Dockerfile --tag maliyet-api-ci services/api
      - name: Verify non-root runtime user
        run: test "$(docker image inspect maliyet-api-ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Verify migration CLI is packaged
        run: docker run --rm --entrypoint python maliyet-api-ci -m py_compile scripts/production_migrate.py
      - name: Start production API image
        run: docker run --detach --rm --name maliyet-api-ci-run --publish 8000:8000 maliyet-api-ci
      - name: Verify liveness endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health >/tmp/health.json; then
              grep -q '"status":"ok"' /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          docker logs maliyet-api-ci-run
          exit 1
      - name: Stop production API image
        if: always()
        run: docker stop maliyet-api-ci-run || true

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run contract
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  web-container:
    name: Web production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production web image
        run: docker build --file apps/web/Dockerfile --tag maliyet-web-ci apps/web
      - name: Verify non-root runtime user
        run: test "$(docker image inspect maliyet-web-ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Start production web image
        run: >-
          docker run --detach --rm --name maliyet-web-ci-run
          --publish 3000:3000
          --env API_BASE_URL=https://api.example.invalid
          maliyet-web-ci
      - name: Verify SaaS response security headers
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --dump-header /tmp/web-headers http://127.0.0.1:3000/ >/tmp/web-body; then
              grep -qi '^X-Content-Type-Options: nosniff' /tmp/web-headers
              grep -qi '^Referrer-Policy: no-referrer' /tmp/web-headers
              grep -qi '^X-Frame-Options: DENY' /tmp/web-headers
              exit 0
            fi
            sleep 1
          done
          docker logs maliyet-web-ci-run
          exit 1
      - name: Verify published Widget SDK headers
        run: |
          curl --fail --silent --show-error --dump-header /tmp/widget-headers \
            http://127.0.0.1:3000/widget/v1.2.0/loader.js >/tmp/widget-loader.js
          tr -d '\r' </tmp/widget-headers >/tmp/widget-headers-normalized
          grep -q '^Access-Control-Allow-Origin: \*$' /tmp/widget-headers-normalized
          grep -qi '^Cache-Control: public, max-age=31536000, immutable$' /tmp/widget-headers-normalized
      - name: Stop production web image
        if: always()
        run: docker stop maliyet-web-ci-run || true
