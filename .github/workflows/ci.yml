name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    env:
      API_IMAGE_REPOSITORY: ghcr.io/example/maliyet-api
      API_IMAGE_DIGEST: "1111111111111111111111111111111111111111111111111111111111111111"
      WEB_IMAGE_REPOSITORY: ghcr.io/example/maliyet-web
      WEB_IMAGE_DIGEST: "2222222222222222222222222222222222222222222222222222222222222222"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/check_repository_contract.py
      - run: python scripts/check_first_release_scope.py
      - run: python scripts/check_production_rollout_contract.py
      - run: python scripts/check_release_contract.py
      - run: python scripts/check_wordpress_plugin_contract.py
      - run: python -m compileall -q scripts services/api/app services/api/tests

  api-quality:
    name: API quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: maliyet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maliyet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/maliyet_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/maliyet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API and development tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest
      - name: Production migration ceremony
        run: python scripts/production_migrate.py
      - name: Production regulatory baseline ceremony
        run: python scripts/production_baseline.py
      - name: Production readiness after baseline
        run: python -m app.production_readiness

  api-container:
    name: API production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build --file services/api/Dockerfile --tag maliyet-api-ci .
      - name: Verify non-root runtime user
        run: test "$(docker image inspect maliyet-api-ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Verify deployment CLIs and baseline evidence are packaged
        run: |
          docker run --rm --entrypoint python maliyet-api-ci -m py_compile scripts/production_migrate.py scripts/production_baseline.py
          docker run --rm --entrypoint python maliyet-api-ci -c "from app.baseline_loader import read_manifest, verify_source_capture; manifest=read_manifest(); [verify_source_capture(source) for source in manifest.sources]; print(manifest.dataset)"
      - name: Start production API image
        run: docker run --detach --rm --name maliyet-api-ci-run --publish 8000:8000 maliyet-api-ci
      - name: Verify liveness endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health >/tmp/health.json; then
              grep -q '"status":"ok"' /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          docker logs maliyet-api-ci-run
          exit 1
      - name: Stop production API image
        if: always()
        run: docker stop maliyet-api-ci-run || true

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      API_BASE_URL: "https://api.example.invalid"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify web contract
        run: npm run contract
      - name: Install exact direct dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Biome lint
        run: npm run lint
      - name: TypeScript 7 CLI
        run: npm run typecheck
      - name: Production runtime configuration contract
        run: npm run runtime:test
      - name: Widget SDK integration contract
        run: npm run widget:test
      - name: Widget branding management contract
        run: npm run management:test
      - name: Calculation workspace contract
        run: npm run calculation:test
      - name: Dashboard data contract
        run: npm run dashboard:test
      - name: Decision analysis workspace contract
        run: npm run decision:test
      - name: Next.js build
        run: npm run build

  web-e2e:
    name: Web end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      API_BASE_URL: "https://api.example.invalid"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install exact direct dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install end-to-end browser
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: End-to-end and screenshot tests
        run: npm run e2e
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: apps/web/tests/e2e/.artifacts
          retention-days: 7

  web-container:
    name: Web production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production web image
        run: docker build --file apps/web/Dockerfile --tag maliyet-web-ci apps/web
      - name: Verify non-root runtime user
        run: test "$(docker image inspect maliyet-web-ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Start production web image
        run: >-
          docker run --detach --rm --name maliyet-web-ci-run --publish 3000:3000
          --env API_BASE_URL=https://api.example.invalid maliyet-web-ci
      - name: Verify application response and security headers
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --dump-header /tmp/web-headers.txt http://127.0.0.1:3000/ >/tmp/web.html; then
              grep -qi '^x-content-type-options: nosniff' /tmp/web-headers.txt
              grep -qi '^x-frame-options: DENY' /tmp/web-headers.txt
              grep -qi '^referrer-policy: no-referrer' /tmp/web-headers.txt
              exit 0
            fi
            sleep 1
          done
          docker logs maliyet-web-ci-run
          exit 1
      - name: Verify immutable widget remains cross-origin consumable
        run: |
          curl --fail --silent --show-error --dump-header /tmp/widget-headers.txt \
            http://127.0.0.1:3000/widget/v1.2.0/loader.js >/tmp/widget-loader.js
          tr -d '\r' </tmp/widget-headers.txt >/tmp/widget-headers-lf.txt
          grep -qi '^access-control-allow-origin: \*$' /tmp/widget-headers-lf.txt
          grep -qi '^cross-origin-resource-policy: cross-origin' /tmp/widget-headers-lf.txt
          grep -qi '^cache-control: public, max-age=31536000, immutable' /tmp/widget-headers-lf.txt
      - name: Stop production web image
        if: always()
        run: docker stop maliyet-web-ci-run || true
